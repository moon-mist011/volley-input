<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>スパイク入力</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">VOLLEYBALL SPIKE LOGGER</p>
        <h1>スパイク入力</h1>
      </div>
      <button id="editSetup" class="header-button" type="button" hidden>登録を編集</button>
    </header>

    <section id="setupScreen" class="screen setup-screen">
      <div class="setup-intro">
        <p class="eyebrow">試合前の準備</p>
        <h2>チームと選手を登録</h2>
        <p>記録校名・対戦校名・背番号を登録してください。リベロにはチェックを入れます。</p>
      </div>

      <form id="schoolForm" class="setup-card">
        <label class="field-label" for="schoolName">記録校名</label>
        <input id="schoolName" class="large-input" type="text" autocomplete="organization" placeholder="例：〇〇高校" required>

        <label class="field-label opponent-label" for="opponentName">対戦校名</label>
        <input id="opponentName" class="large-input" type="text" autocomplete="off" placeholder="例：△△高校" required>

        <div class="roster-title">
          <label class="field-label" for="playerNumber">背番号</label>
          <span>0〜99</span>
        </div>
        <div class="add-player-row">
          <input id="playerNumber" class="large-input number-input" type="number" min="0" max="99" inputmode="numeric" placeholder="例：4">
          <label class="libero-toggle">
            <input id="isLibero" type="checkbox">
            <span>リベロ</span>
          </label>
          <button id="addPlayer" class="add-button" type="button">選手を追加</button>
        </div>
        <p id="setupMessage" class="form-message" role="status"></p>

        <div class="registered-heading">
          <h3>登録選手</h3>
          <span id="rosterCount">0人</span>
        </div>
        <ul id="rosterList" class="roster-list"></ul>

        <fieldset class="baseline-setting">
          <legend>エンドラインはどちら側？</legend>
          <p>コース図の向きに反映します。</p>
          <div class="baseline-options">
            <label class="baseline-option">
              <input id="baselineNear" type="radio" name="baselineSide" value="near" checked>
              <span>手前（エンドラインを下に表示）</span>
            </label>
            <label class="baseline-option">
              <input id="baselineFar" type="radio" name="baselineSide" value="far">
              <span>奥（エンドラインを上に表示）</span>
            </label>
          </div>
        </fieldset>

        <button id="startMatch" class="start-button" type="submit">試合開始</button>
      </form>
      <button id="undoFinish" class="undo-finish-button" type="button" hidden>試合終了を取り消す</button>
    </section>

    <section id="matchScreen" class="screen match-screen" hidden>
      <div class="match-bar">
        <div>
          <span class="summary-label">記録中</span>
          <strong id="activeSchool"></strong>
        </div>
        <div class="match-actions">
          <button id="backButton" class="back-button" type="button">← 戻る</button>
          <button id="finishMatch" class="finish-button" type="button">試合終了</button>
        </div>
      </div>

      <section class="input-panel" aria-live="polite">
        <div class="progress-row">
          <span id="stepCounter"></span>
          <div class="progress-track"><span id="progressBar"></span></div>
        </div>
        <p class="eyebrow">SPIKE INPUT</p>
        <h2 id="question"></h2>
        <p id="stepHint" class="step-hint"></p>
        <div id="choiceArea"></div>
      </section>

      <section id="currentMatchHistory" class="history card">
        <div class="section-heading history-heading">
          <h2>この試合の入力履歴</h2>
          <span id="currentMatchRecordCount">0 件</span>
        </div>
        <div id="emptyCurrentMatch" class="empty">この試合の記録はまだありません</div>
        <ol id="currentMatchHistoryList" class="history-list"></ol>
      </section>
    </section>

    <section id="historyHub" class="history-hub">
      <button id="historyToggle" class="history-toggle" type="button" aria-expanded="false">
        <span id="historyToggleLabel">入力履歴を見る</span>
        <span id="historySummary">0試合・0件</span>
      </button>
      <div id="historyBrowser" hidden>
        <section id="matchListView" class="history card">
          <div class="section-heading history-heading">
            <h2>入力した対戦カード</h2>
          </div>
          <div id="emptyHistory" class="empty">まだ入力履歴がありません</div>
          <div id="matchCards" class="match-card-list"></div>
        </section>
        <section id="matchDetailView" class="history card" hidden>
          <div class="detail-heading">
            <button id="backToMatchList" class="back-button" type="button">← 対戦カード一覧</button>
            <div>
              <h2 id="detailMatchup"></h2>
              <span id="recordCount"></span>
            </div>
          </div>
          <ol id="historyList" class="history-list"></ol>
          <button id="copyMatch" class="history-action-button" type="button">この試合の記録をコピー</button>
        </section>
        <div class="history-actions">
        <button id="copyAll" type="button" disabled>履歴をまとめてコピー</button>
        <button id="openTarget" class="primary-outline" type="button">元サイトを開く</button>
        </div>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
